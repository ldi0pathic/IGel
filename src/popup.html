<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="logo" src="icons/icon128.png" alt="IGel" width="24" height="24">
      <h1>IGel</h1>
    </div>
    <span class="version"></span>
  </header>

  <main>
    <p class="hint" id="hint"></p>

    <section class="settings" aria-labelledby="download-path-heading">
      <h2 id="download-path-heading">Download-Ordner</h2>
      <form id="download-path-form">
        <label for="download-path">Pfad innerhalb von „Downloads“</label>
        <input id="download-path" type="text" spellcheck="false" autocomplete="off" placeholder="IGel/{platform}">
        <p class="field-error" id="download-path-error" role="alert" hidden></p>
        <div class="settings-actions">
          <button class="save-button" type="submit">Speichern</button>
          <p class="save-status" id="save-status" aria-live="polite"></p>
        </div>
      </form>

      <p class="settings-help">Du kannst Unterordner mit <code>/</code> anlegen. Verfügbare Platzhalter:</p>
      <ul class="token-list" aria-label="Verfügbare Platzhalter">
        <li><code>{platform}</code> Plattform</li>
        <li><code>{username}</code> Benutzername</li>
        <li><code>{postId}</code> Beitrags-ID</li>
        <li><code>{type}</code> Medientyp</li>
        <li><code>{index}</code> Nummer</li>
        <li><code>{date}</code> Datum</li>
      </ul>
      <p class="example">Beispiel: <code>IGel/{username}/{date}</code></p>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
